<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Loan - Smart Lender AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="text-center text-primary mb-4">
            🏦 Smart Lender AI - Loan Application
        </h2>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Gender</label>
                    <select class="form-control" name="Gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Married</label>
                    <select class="form-control" name="Married" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    
                </div>

                <div class="col-md-6 mb-3">
                    <label>Education</label>
                    <select class="form-control" name="Education" required>
                        <option value="Graduate">Graduate</option>
                        <option value="Not Graduate">Not Graduate</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Self Employed</label>
                    <select class="form-control" name="Self_Employed" required>
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Applicant Income</label>
                    <input type="number" class="form-control" name="ApplicantIncome" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Coapplicant Income</label>
                    <input type="number" class="form-control" name="CoapplicantIncome" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Loan Amount</label>
                    <input type="number" class="form-control" name="LoanAmount" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Loan Amount Term</label>
                    <input type="number" class="form-control" name="Loan_Amount_Term" value="360" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Credit History</label>
                    <select class="form-control" name="Credit_History" required>
                        <option value="1.0">Good</option>
                        <option value="0.0">Bad</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Property Area</label>
                    <select class="form-control" name="Property_Area" required>
                        <option value="Urban">Urban</option>
                        <option value="Semiurban">Semiurban</option>
                        <option value="Rural">Rural</option>
                    </select>
                </div>
                </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success btn-lg">
                    🤖 Predict Loan
                </button>
            </div>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>

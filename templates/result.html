<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Prediction Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body style="background:#f4f7fc;">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/dashboard">
            🏦 Smart Lender AI
        </a>

        <a href="/dashboard" class="btn btn-light">
            Dashboard
        </a>

    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-lg border-0">

                <div class="card-body text-center p-5">

                    {% if "Approved" in result %}

                        <i class="fas fa-check-circle fa-5x text-success"></i>

                        <h2 class="text-success mt-4">
                            {{ result }}
                        </h2>

                        <p class="lead">
                            Congratulations {{ user }}! Your loan is likely to be approved.
                        </p>

                    {% else %}

                        <i class="fas fa-times-circle fa-5x text-danger"></i>

                        <h2 class="text-danger mt-4">
                            {{ result }}
                        </h2>

                        <p class="lead">
                            Sorry {{ user }}, your loan is likely to be rejected.
                        </p>

                    {% endif %}

                    <hr>

                    <a href="/apply" class="btn btn-primary me-2">
                        Apply Again
                    </a>

                    <a href="/dashboard" class="btn btn-success me-2">
                        Dashboard
                    </a>

                    <a href="/download-report" class="btn btn-danger">
                        Download PDF
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
